<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CompBio Bootcamp</title>
  <meta name="description" content="CompBio Bootcamp: מאפס לעוזר מחקר. ביולוגיה חישובית בעברית, עם שיעורים אינטראקטיביים וסביבת Python שרצה בדפדפן.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M10 6c0 6 12 8 12 14s-12 0-12 6M22 6c0 6-12 8-12 14' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Heebo:wght@300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/visuals.css">
</head>
<body>
  <div class="app" id="app">
    <!-- ───────────── Sidebar ───────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22"><path d="M10 5c0 6 12 8 12 14s-12 2-12 8M22 5c0 6-12 8-12 14s12 2 12 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M12 9h8M12 23h8M14 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">CompBio Bootcamp</div>
          <div class="brand-tag">מאפס לעוזר מחקר</div>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-row">
          <span class="progress-label">התקדמות בקורס</span>
          <span class="progress-count" id="progressCount" dir="ltr">0 / 4</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="nav-label">תוכנית הלימודים</div>
      <nav class="module-nav" id="moduleNav" aria-label="מודולים"></nav>

      <div class="sidebar-foot">
        <div class="shortcuts">
          <div><span class="kbds" dir="ltr"><kbd data-mod>⌘</kbd><kbd>↵</kbd></span><span>הרצת בדיקות</span></div>
          <div><span class="kbds" dir="ltr"><kbd data-mod>⌘</kbd><kbd>⇧</kbd><kbd>↵</kbd></span><span>הגשה</span></div>
          <div><span class="kbds" dir="ltr"><kbd data-mod>⌘</kbd><kbd>/</kbd></span><span>הפיכת שורה להערה</span></div>
        </div>
        <button class="btn btn-ghost btn-sm btn-block" id="resetAllBtn">איפוס כל ההתקדמות</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ───────────── Main ───────────── -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="פתיחת תוכנית הלימודים">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="crumbs">
          <span class="crumb-dim" id="crumbModule">מודול 1</span>
          <span class="crumb-sep">/</span>
          <span class="crumb-title" id="crumbTitle">—</span>
          <span class="badge" id="crumbDifficulty">קל</span>
        </div>
        <div class="topbar-actions">
          <div class="py-status" id="pyStatus" data-state="loading" title="מצב סביבת Python">
            <span class="py-dot"></span><span class="py-text">טוען Python…</span>
          </div>
          <button class="btn btn-run" id="runBtn" title="הרצת הבדיקות הגלויות (⌘/Ctrl + Enter)">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>
            <span>הרצה</span>
          </button>
          <button class="btn btn-submit" id="submitBtn" title="הגשה מול כל הבדיקות, כולל הנסתרות (⌘/Ctrl + Shift + Enter)">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 12 12)"/></svg>
            <span>הגשה</span>
          </button>
        </div>
      </header>

      <div class="workspace" id="workspace">
        <!-- Left pane: Lesson / Problem -->
        <section class="pane pane-left" id="paneLeft">
          <div class="pane-tabs" role="tablist">
            <button class="pane-tab active" data-tab="lesson" role="tab">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 21V5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
              שיעור
            </button>
            <button class="pane-tab" data-tab="problem" role="tab">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
              תרגיל
            </button>
          </div>
          <div class="pane-body" id="leftBody">
            <article class="doc" id="lessonView"></article>
            <article class="doc" id="problemView" hidden></article>
          </div>
        </section>

        <div class="gutter gutter-x" id="gutterX" role="separator" aria-orientation="vertical"></div>

        <!-- Right pane: Editor + Console -->
        <section class="pane pane-right" id="paneRight">
          <div class="editor-panel" id="editorPanel" dir="ltr">
            <div class="panel-head">
              <div class="file-tab">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3c-4 0-4 1.8-4 3v2h4v1H6c-2 0-3 1.5-3 4s1 4 3 4h2v-3c0-1.5 1.2-3 3-3h4c1.4 0 2-.8 2-2V6c0-1.6-1.5-3-5-3z" fill="#4b8bbe"/><path d="M12 21c4 0 4-1.8 4-3v-2h-4v-1h6c2 0 3-1.5 3-4s-1-4-3-4h-2v3c0 1.5-1.2 3-3 3H9c-1.4 0-2 .8-2 2v3c0 1.6 1.5 3 5 3z" fill="#ffd43b"/></svg>
                <span>solution.py</span>
                <span class="save-indicator" id="saveIndicator" dir="rtl">נשמר</span>
              </div>
              <div class="panel-actions">
                <span class="lang-pill">Python 3</span>
                <button class="icon-btn" id="resetCodeBtn" title="איפוס לקוד ההתחלתי">
                  <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
            <div class="editor-host" id="editorHost"></div>
          </div>

          <div class="gutter gutter-y" id="gutterY" role="separator" aria-orientation="horizontal"></div>

          <div class="console-panel" id="consolePanel" dir="ltr">
            <div class="panel-head">
              <div class="console-tabs" role="tablist">
                <button class="console-tab active" data-ctab="tests">
                  <svg viewBox="0 0 24 24" width="13" height="13"><path d="M5 12l4 4 10-10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  תוצאות בדיקות
                </button>
                <button class="console-tab" data-ctab="stdout">
                  <svg viewBox="0 0 24 24" width="13" height="13"><path d="M5 7l5 5-5 5M12 17h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  פלט
                  <span class="tab-count" id="stdoutCount" hidden></span>
                </button>
              </div>
              <div class="panel-actions">
                <button class="icon-btn" id="clearConsoleBtn" title="ניקוי המסוף">
                  <svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
            <div class="console-body" id="consoleTests"></div>
            <div class="console-body" id="consoleStdout" hidden></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- CodeMirror 5 (editor + static highlighting). If the CDN fails, editor.js falls back to a styled textarea. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>

  <!-- App (classic scripts, attached to window.CBB; load order matters) -->
  <script src="js/storage.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/curriculum-advanced.js"></script>
  <script src="js/curriculum-expert.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/visuals-advanced.js"></script>
  <script src="js/visuals-expert.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/console.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
